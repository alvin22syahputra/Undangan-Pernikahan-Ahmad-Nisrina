<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Ahmad & Nisrina</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .text-maroon { color: #800000; }
    .bg-maroon { background-color: #800000; }
    .border-maroon { border-color: #800000; }
  </style>
</head>
<body class="bg-[#fffaf5] text-gray-800">

  <!-- HERO -->
  <section class="text-center py-16 bg-maroon text-white">
    <h1 class="text-4xl font-bold mb-2">Ahmad & Nisrina</h1>
    <p class="text-lg">Dengan memohon rahmat Allah SWT, kami mengundang Anda</p>
    <p class="mt-4">Sabtu, 20 Desember 2025</p>
  </section>

  <!-- RSVP & UCAPAN -->
  <section class="max-w-2xl mx-auto py-12 px-4">
    <h2 class="text-2xl font-bold text-center text-maroon mb-6">RSVP & Ucapan</h2>
    
    <form id="rsvpForm" class="bg-white p-6 rounded-lg shadow space-y-4 mb-10">
      <div>
        <label class="block font-semibold mb-1">Nama</label>
        <input type="text" id="nama" required class="w-full border-maroon rounded p-2">
      </div>
      <div>
        <label class="block font-semibold mb-1">Kehadiran</label>
        <select id="kehadiran" required class="w-full border-maroon rounded p-2">
          <option value="Hadir">Hadir</option>
          <option value="Tidak Hadir">Tidak Hadir</option>
        </select>
      </div>
      <div>
        <label class="block font-semibold mb-1">Ucapan & Doa</label>
        <textarea id="ucapan" rows="3" required class="w-full border-maroon rounded p-2"></textarea>
      </div>
      <button type="submit" class="w-full bg-maroon text-white py-2 rounded font-bold hover:opacity-90">
        Kirim Ucapan
      </button>
    </form>

    <h3 class="text-xl font-bold text-maroon mb-4">Ucapan & Doa</h3>
    <div id="daftarUcapan" class="space-y-3">
      <p class="text-center text-gray-500">Memuat ucapan...</p>
    </div>
  </section>

<script>
  // !!! GANTI DENGAN LINK APPS SCRIPT KAMU !!!
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzK3PIW-0V6OxclRAH57sKEaXlrp-eb6NTvgWiOO7IBrD2hxopAESBbFafb0Bc6bjrQ/exec";

  // 1. KIRIM DATA KE SPREADSHEET
  document.getElementById('rsvpForm').addEventListener('submit', function(e){
    e.preventDefault();
    const btn = this.querySelector('button');
    btn.innerText = 'Mengirim...';
    btn.disabled = true;

    const formData = {
      action: "submit",
      nama: document.getElementById('nama').value,
      ucapan: document.getElementById('ucapan').value,
      kehadiran: document.getElementById('kehadiran').value
    };
    
    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(formData)
    }).then(res => res.json())
    .then(() => {
      alert('Terima kasih! Ucapan terkirim 💌');
      this.reset();
      loadUcapan(); // refresh daftar ucapan
    }).catch(err => {
      alert('Gagal kirim. Coba lagi ya');
      console.log(err)
    }).finally(() => {
      btn.innerText = 'Kirim Ucapan';
      btn.disabled = false;
    });
  });

  // 2. AMBIL DATA DARI SPREADSHEET
  function loadUcapan(){
    fetch(SCRIPT_URL) // pake GET
    .then(res => res.json()).then(data => {
      if(data.length === 0){
        document.getElementById('daftarUcapan').innerHTML = `<p class="text-center text-gray-500">Belum ada ucapan. Jadilah yang pertama!</p>`;
        return;
      }
      document.getElementById('daftarUcapan').innerHTML = data.map(d => `
        <div class="bg-white p-4 rounded-lg shadow border-l-4 border-maroon">
          <p class="font-bold text-maroon">${d.nama} <span class="text-sm font-normal text-gray-600">- ${d.kehadiran}</span></p>
          <p class="mt-1">${d.ucapan}</p>
        </div>
      `).join('');
    }).catch(err => {
      document.getElementById('daftarUcapan').innerHTML = `<p class="text-center text-red-500">Gagal memuat ucapan</p>`;
      console.log('Gagal load', err)
    });
  }

  // Panggil pas halaman dibuka
  loadUcapan();
</script>

</body>
</html>
